name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System dependencies (cairo, pango, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Python dependencies
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: python -m pytest tests -q

      - name: Export blocks up to date
        run: python scripts/gen_exports.py --check

      - name: Render every example (examples/*.py)
        run: bash scripts/render_examples.sh "$RUNNER_TEMP/media"

      - name: Upload rendered examples
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: ${{ runner.temp }}/media/images/
          if-no-files-found: error
