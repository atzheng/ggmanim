name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: System dependencies (cairo, pango, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Render example
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: manim -ql -s --media_dir "$RUNNER_TEMP/media" examples/basic.py Basic

      - name: Upload rendered example
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: ${{ runner.temp }}/media/images/
